# ============================================================
# YOLO 训练的「数据配置单」
#
# 训练时把这个文件告诉模型，它就知道：
#   去哪找图片、去哪找标注、有哪几个类别
#
# 用法（在 train_lane.py 里）：
#   model.train(data="data/lane/data.yaml")
# ============================================================

# 数据集根目录。下面写的相对路径都以它为基准
path: D:/yolo-practice/data/lane

# 训练集清单文件（里面每行是一个图片路径）
train: train.txt

# 验证集清单文件
val: val.txt

# 类别清单
#   左边是编号（从 0 开始），右边是名字
#   必须和 data/lane/classes.txt 里的顺序完全一致
#   这里只有一类：车道线
names:
  0: lane
